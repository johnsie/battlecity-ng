# Publishes a GitHub Release when a version tag is pushed (vMAJOR.MINOR.PATCH): Linux and Windows clients and servers.
# Nothing is deployed from GitHub: the LAN host pulls the published release itself (see docs/deploy.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_SERVER=OFF
          cmake --build build -j"$(nproc)"
      - name: Smoke test
        run: ci/smoke-test-client.sh build/client/bc-client data
      - name: Package
        run: ci/package-client.sh build/client/bc-client "${GITHUB_REF_NAME#v}" linux-x86_64 dist
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux-client, path: dist/* }

  linux-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake libsqlite3-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_CLIENT=OFF
          cmake --build build -j"$(nproc)"
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ci/smoke-test.sh build/server/bc-server data/map.dat
      - name: Package
        run: ci/package-server.sh build "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux-server, path: dist/* }

  windows-client:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            zip
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_SERVER=OFF
          cmake --build build
      - name: Package
        run: ci/package-client.sh build/client/bc-client.exe "${GITHUB_REF_NAME#v}" windows-x64 dist
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows-client, path: dist/* }

  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (MSVC)
        run: |
          cmake -S . -B build -A x64 -DBC_BUILD_CLIENT=OFF
          cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $d = "battlecity-server-$v"
          New-Item -ItemType Directory -Force $d, dist | Out-Null
          Copy-Item build/server/Release/bc-server.exe, build/server/Release/bc-server.pdb, data/map.dat, LICENSE.txt $d
          Set-Content "$d/VERSION" $v
          Compress-Archive -Path $d -DestinationPath "dist/$d-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows-server, path: dist/* }

  web-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/bc-emsdk
          key: emsdk-3.1.74-${{ runner.os }}
      - name: Build (Emscripten)
        run: ci/build-web.sh build-web dist-web
      - name: Package
        run: ci/package-web.sh dist-web "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with: { name: dist-web, path: dist/* }

  publish:
    needs: [linux-client, linux-server, windows-client, windows-server, web-client]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
