# Install as /etc/apache2/sites-available/bc-outiva-com.conf and enable with a2ensite.
#
# Public TLS terminates at HAProxy; the certificate below is a self-signed origin certificate for the
# HTTPS backend (HAProxy talks to this vhost over TLS with SNI bc.outiva.com, without verification).
#
# The old bc.outiva.com vhosts (inside outiva-com.conf, serving /opt/lampp/battlecity) are removed by
# setup-web.sh. Do not name this file 000-*: the first :443 vhost is the default for every unmatched
# hostname on this shared server.

<VirtualHost *:80>
    ServerName bc.outiva.com
    Redirect permanent / https://bc.outiva.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName bc.outiva.com
    DocumentRoot /var/www/bc.outiva.com/current

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/bc-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/bc-origin.key

    # Browser game traffic: WebSocket -> websockify (battlecity-ws.service) -> game server on 127.0.0.1:9680
    ProxyRequests Off
    ProxyPass /ws ws://127.0.0.1:9681/ retry=0 timeout=300
    ProxyPassReverse /ws ws://127.0.0.1:9681/

    <Directory /var/www/bc.outiva.com/current>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <IfModule mod_mime.c>
        AddType application/wasm .wasm
        AddType application/javascript .js
        AddType application/octet-stream .data
    </IfModule>
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Frame-Options "DENY"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Embedder-Policy "require-corp"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://bc.outiva.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
        <FilesMatch "\.(js|wasm|data|html)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/bc.outiva.com-error.log
    CustomLog ${APACHE_LOG_DIR}/bc.outiva.com-access.log combined
</VirtualHost>
