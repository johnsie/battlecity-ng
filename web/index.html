<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle City</title>
<style>
  :root { --bg:#111; --fg:#eee; --accent:#e33; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f4; --fg:#222; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:34rem; padding:1.5rem; text-align:center; }
  h1 { color:var(--accent); letter-spacing:.05em; }
  code { background:rgba(128,128,128,.25); padding:.1em .4em; border-radius:3px; }
</style>
</head>
<body>
<main>
  <h1>BATTLE CITY</h1>
  <p>The browser version is on its way.</p>
  <p>The game server is live at <code>bc.outiva.com:9680</code> for the desktop clients.</p>
</main>
</body>
</html>
