<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle City</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Cpath d='M3 13V6l5-3 5 3v7z' fill='%23e33'/%3E%3C/svg%3E">
<script>
  window.outivaAuthModule = import('./outiva-auth.js');
  window.beginOutivaSignIn = function () {
    return window.outivaAuthModule.then(function (auth) { return auth.signInWithOutiva('battlecity-web'); });
  };
  window.outivaIdentityReady = window.outivaAuthModule.then(function (auth) {
    return auth.initialiseOutivaIdentity({ clientId: 'battlecity-web', appId: 'battlecity' });
  });
</script>
<style>
  :root { --bg:#0b0b0b; --fg:#ddd; --accent:#e33; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  /* The stage fills the window: the game adapts its view to the canvas shape (widescreen shows more map; narrow shapes letterbox inside the canvas) */
  #stage { position:relative; width:100vw; height:100vh; }
  canvas { display:block; width:100%; height:100%; background:#000; outline:none; }
  #status { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1rem; pointer-events:none; }
  #status h1 { color:var(--accent); letter-spacing:.06em; margin:0 0 .5rem; }
  #bar { width:min(320px, 70%); height:6px; background:#333; border-radius:3px; overflow:hidden; }
  #bar > div { height:100%; width:0; background:var(--accent); }
  #status.hidden { display:none; }
  #status.ended { background:rgba(0,0,0,.78); pointer-events:auto; }
  #error { color:#ff8080; margin-top:1rem; white-space:pre-wrap; max-width:36rem; }
  #outiva-account { margin:.5rem 0 0; color:#999; font-size:.82rem; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status"><h1>BATTLE CITY</h1><div id="msg">Loading...</div><div id="bar"><div id="fill"></div></div><p id="outiva-account">Guest play — no Outiva account required</p><div id="error"></div></div>
</div>
<script>
  var statusEl = document.getElementById('status'), msgEl = document.getElementById('msg'),
      fillEl = document.getElementById('fill'), errEl = document.getElementById('error');
  window.bcSetLoginLayout = function (active) {
    document.getElementById('stage').classList.toggle('login-layout', active);
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
  };
  var Module = {
    canvas: document.getElementById('canvas'),
    // The game's TCP connection is carried over a WebSocket to the gateway behind Apache (see deploy/web)
    websocket: { url: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws', subprotocol: 'binary' },
    // Test hooks: ?script=<commands> runs the client's built-in test script, ?debug=1 logs dropped packets
    preRun: [function () {
      addRunDependency('outiva-identity');
      Promise.resolve(window.outivaIdentityReady).then(function (profile) {
        window.outivaProfile = profile;
        if (!profile) return;
        var label = profile.name || profile.preferred_username || profile.email || 'Outiva user';
        document.getElementById('outiva-account').textContent = 'Outiva account: ' + label;
        var source = profile.callsign || profile.preferred_username || profile.name || (profile.email || '').split('@')[0];   // the callsign chosen on the Outiva account comes first
        ENV.BC_OUTIVA_NAME = source.replace(/[^A-Za-z0-9 _-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 15);
      }).catch(function (error) {
        console.warn('Optional Outiva identity was not available', error);
      }).finally(function () { removeRunDependency('outiva-identity'); });
      // After a hot update the previous page left the account here (see HotUpdateTick in client/platform/main_sdl.cpp): the game logs in with it
      // by itself and the server puts the player back where they were. It is read once and removed.
      try {
        var saved = sessionStorage.getItem('bc.resume');
        sessionStorage.removeItem('bc.resume');
        if (saved) { var r = JSON.parse(saved); if (r && r.u && r.p) { ENV.BC_RESUME_USER = String(r.u).slice(0, 15); ENV.BC_RESUME_PASS = String(r.p).slice(0, 15); } }
      } catch (e) { /* storage unavailable: the player simply logs in again */ }
      var q = new URLSearchParams(location.search);
      if (q.get('script')) { FS.writeFile('/test-script.txt', q.get('script')); ENV.BC_TEST_SCRIPT = '/test-script.txt'; }
      if (q.get('debug')) { ENV.BC_DEBUG_NET = '1'; }
    }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (!t) { statusEl.classList.add('hidden'); document.getElementById('canvas').focus(); return; }
      var m = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(t);
      if (m) { fillEl.style.width = (100 * m[2] / m[4]) + '%'; msgEl.textContent = m[1].trim(); } else { msgEl.textContent = t; }
    },
    onAbort: function (what) { statusEl.classList.remove('hidden'); errEl.textContent = 'The game stopped: ' + what; }
  };
  // Hot updates: every release publishes a VERSION file next to the page. When it changes while the game is open, the game is told
  // (window.bcUpdatePending) and reloads itself at a quiet moment, keeping the player's place (see docs/hot-updates.md).
  (function () {
    var loaded = null;
    function current() {
      return fetch('VERSION?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) { return t && t.trim().slice(0, 64); }).catch(function () { return null; });
    }
    function check() {
      current().then(function (v) {
        if (!v) return;
        if (loaded === null) { loaded = v; return; }
        if (v !== loaded) window.bcUpdatePending = true;
      });
    }
    check();
    setInterval(check, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();
  // Called by the game when it ends (quit, disconnected): the canvas would otherwise just freeze
  window.bcEnded = function () {
    statusEl.classList.remove('hidden'); statusEl.classList.add('ended');
    msgEl.textContent = 'The game has ended. Reload the page to play again.';
    document.getElementById('bar').style.display = 'none';
  };
  window.addEventListener('error', function (e) { statusEl.classList.remove('hidden'); errEl.textContent = 'Error: ' + e.message; });
</script>
{{{ SCRIPT }}}
</body>
</html>
