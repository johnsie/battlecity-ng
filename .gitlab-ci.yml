# Battle City CI on the LAN (fast feedback). Releases are built, packaged and published by GitHub Actions and deployed by the
# GitHub runner on the production host (see docs/deploy.md). The deploy jobs here remain only as a MANUAL fallback.
# Linux jobs run on the runner tagged `ubuntu-server` (shell executor, on the same host that runs the game server).
# Required on that host: build-essential cmake libsqlite3-dev  (see deploy/README.md)

stages: [build, test, package, deploy]

default:
  tags: [ubuntu-server]

variables:
  GIT_DEPTH: "20"

build:server-linux:
  stage: build
  script:
    # server only: a client problem must never block a server deploy
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_CLIENT=OFF
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure
  artifacts:
    paths: [build/server/bc-server]
    expire_in: 1 week

test:server-smoke:
  stage: test
  needs: [build:server-linux]
  script:
    - ci/smoke-test.sh build/server/bc-server data/map.dat

# Native (Linux) client: built and smoke-tested, but independent of the server deploy
build:client-linux:
  stage: build
  script:
    - cmake -S . -B build-client -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_SERVER=OFF
    - cmake --build build-client -j"$(nproc)"
  artifacts:
    paths: [build-client/client/bc-client]
    expire_in: 1 week

test:client-smoke:
  stage: test
  needs: [build:client-linux]
  script:
    - ci/smoke-test-client.sh build-client/client/bc-client data

# Same server built with AddressSanitizer/UBSan: out-of-range indexing (the Windows crash class) fails here, before deploy
test:server-sanitizers:
  stage: test
  script:
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBC_BUILD_CLIENT=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
    - cmake --build build-asan -j"$(nproc)"
    - ci/smoke-test.sh build-asan/server/bc-server data/map.dat
    - ci/fuzz-test.sh build-asan/server/bc-server data/map.dat
    - ci/relay-test.sh build-asan/server/bc-server data/map.dat
    - ci/load-test.sh build-asan/server/bc-server data/map.dat 20 60

package:server-linux:
  stage: package
  needs: [build:server-linux, test:server-smoke, test:server-sanitizers]
  script:
    - ci/package-server.sh build "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" dist
  artifacts:
    paths: [dist/]
    expire_in: 4 weeks

deploy:production:
  stage: deploy
  needs: [package:server-linux]
  rules:
    - when: manual      # fallback only: GitHub's `deploy` workflow is the normal path
      allow_failure: true
  resource_group: production      # never run two deploys at once
  environment:
    name: production
    url: https://bc.outiva.com
  script:
    - ci/deploy.sh dist/battlecity-server-*-linux-x86_64.tar.gz "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

# Browser client (https://bc.outiva.com via Apache). Built with Emscripten, then published to the web root.
# Runs when the client, its data or the web files change.
.web-changes: &web-changes
  changes:
    - client/**/*
    - web/**/*
    - tools/stage-web-data.sh
    - external/imgui/**/*
    - data/*.bmp
    - data/*.ttf
    - data/*.dat
    - data/wav/*
    - data/midi/*
    - CMakeLists.txt
    - ci/build-web.sh
    - ci/deploy-web.sh

build:web:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *web-changes
    - when: manual
      allow_failure: true
  script:
    - ci/build-web.sh build-web dist-web
  artifacts:
    paths: [dist-web/]
    expire_in: 4 weeks

deploy:web:
  stage: deploy
  needs: [build:web]
  rules:
    - when: manual      # fallback only: GitHub's `deploy` workflow is the normal path
      allow_failure: true
  resource_group: production-web
  environment:
    name: production-web
    url: https://bc.outiva.com
  script:
    - ci/deploy-web.sh dist-web "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
