# Battle City CI on the LAN: build, test, package and deploy to production (job deploy:production). It has nothing to do with
# GitHub Actions, which separately builds and publishes the public releases. See docs/deploy.md.
# Linux jobs run on the runner tagged `ubuntu-server` (shell executor, on the same host that runs the game server).
# Required on that host: build-essential cmake libsqlite3-dev  (see deploy/README.md)

stages: [build, test, package, deploy]

default:
  tags: [ubuntu-server]
  # GitLab/runner hiccups (a 502 while fetching the repo, a lost runner) must not block a release: retry those, never real test failures
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure, api_failure]

variables:
  GIT_DEPTH: "20"

build:server-linux:
  stage: build
  script:
    # server only: a client problem must never block a server deploy
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_CLIENT=OFF
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure
  artifacts:
    paths: [build/server/bc-server]
    expire_in: 1 week

test:server-smoke:
  stage: test
  resource_group: test-ports   # the tests bind fixed local ports: never run two pipelines' tests at once
  needs: [build:server-linux]
  script:
    - ci/smoke-test.sh build/server/bc-server data/map.dat

# Native (Linux) client: built and smoke-tested, but independent of the server deploy
build:client-linux:
  stage: build
  script:
    - cmake -S . -B build-client -DCMAKE_BUILD_TYPE=Release -DBC_BUILD_SERVER=OFF
    - cmake --build build-client -j"$(nproc)"
  artifacts:
    paths: [build-client/client/bc-client]
    expire_in: 1 week

test:client-smoke:
  stage: test
  resource_group: test-ports   # the tests bind fixed local ports: never run two pipelines' tests at once
  needs: [build:client-linux]
  script:
    - ci/smoke-test-client.sh build-client/client/bc-client data

# Same server built with AddressSanitizer/UBSan: out-of-range indexing (the Windows crash class) fails here, before deploy
test:server-sanitizers:
  stage: test
  resource_group: test-ports   # the tests bind fixed local ports: never run two pipelines' tests at once
  script:
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBC_BUILD_CLIENT=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
    - cmake --build build-asan -j"$(nproc)"
    - ci/smoke-test.sh build-asan/server/bc-server data/map.dat
    - ci/fuzz-test.sh build-asan/server/bc-server data/map.dat
    - ci/relay-test.sh build-asan/server/bc-server data/map.dat
    - ci/bots-test.sh build-asan/server/bc-server data/map.dat
    - ci/resume-test.sh build-asan/server/bc-server data/map.dat
    - ci/voice-test.sh build-asan/server/bc-server data/map.dat
    - ci/waypoints-test.sh build-asan/server/bc-server data/map.dat
    - ci/load-test.sh build-asan/server/bc-server data/map.dat 20 20

# Production deploy, entirely on GitLab: the server and the web client are built and tested above, packaged here and installed on
# this host. GitHub is not involved (it builds and publishes its own public releases from the same tag; neither waits for the other).
# Runs automatically for every v* tag: players are restarted onto the new version.
package:server-linux:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build:server-linux, test:server-smoke, test:server-sanitizers]
  script:
    - ci/package-server.sh build "${CI_COMMIT_TAG#v}" dist
  artifacts:
    paths: [dist/]
    expire_in: 4 weeks

# Browser client (https://bc.outiva.com via the web server), built with Emscripten
build:web:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: manual
      allow_failure: true
  script:
    - ci/build-web.sh build-web dist-web
    - V="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"; ci/package-web.sh dist-web "${V#v}" dist-web-pkg
  artifacts:
    paths: [dist-web-pkg/]
    expire_in: 4 weeks

deploy:production:
  stage: deploy
  needs: [package:server-linux, build:web]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: on_success
  resource_group: production      # never run two deploys at once
  environment:
    name: production
    url: https://bc.outiva.com
  script:
    - ci/deploy.sh dist/battlecity-server-*-linux-x86_64.tar.gz "$CI_COMMIT_TAG"
    - mkdir web-site && tar -xzf dist-web-pkg/battlecity-web-*.tar.gz -C web-site --strip-components=1
    - ci/deploy-web.sh web-site "$CI_COMMIT_TAG"
